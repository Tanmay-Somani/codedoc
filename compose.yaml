name: codedoc

# ============================================================
# AI Codebase Doctor - base Compose stack (LITE)
# Shared services + application containers.
#
#   Dev:  docker compose up -d            (auto-merges compose.override.yaml)
#   Prod: docker compose -f compose.yaml -f compose.prod.yml up -d
#   Full: docker compose -f compose.yaml -f compose.prod.yml \
#           -f compose.full.yml --profile full up -d
#
# App ports are NOT published here; the dev overlay publishes them and prod
# serves behind a reverse proxy.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codedoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codedoc}
      POSTGRES_DB: ${POSTGRES_DB:-codedoc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codedoc} -d ${POSTGRES_DB:-codedoc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codedoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-codedoc-minio}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api

volumes:
  pgdata:
  valkeydata:
  qdrantdata:
  miniodata: