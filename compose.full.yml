name: codedoc

# ============================================================
# STANDARD / FULL mode services - heavy or optional, ALWAYS behind
# Compose profiles so the default stack stays light.
#
#   docker compose --profile standard -f compose.yaml -f compose.prod.yml -f compose.full.yml up -d
#   docker compose --profile full     -f compose.yaml -f compose.prod.yml -f compose.full.yml up -d
#
# IMPORTANT: the public demo runs LITE only. Do NOT host this whole stack
# on a tiny free instance - it will become the bottleneck.
# ============================================================

services:
  # Optional local LLM mode (OLLAMA_ENABLED=true). OpenRouter is the default.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    profiles: [full]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:${SEARXNG_PORT:-8080}
    volumes:
      - searxngdata:/etc/searxng
    profiles: [standard, full]

  mlflow:
    # Requires an aux DB first: docker compose exec postgres createdb -U codedoc mlflow glitchtip
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri",
              "postgresql://${POSTGRES_USER:-codedoc}:${POSTGRES_PASSWORD:-codedoc}@postgres:5432/mlflow"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    profiles: [standard, full]

  glitchtip:
    env_file: .env
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-codedoc}:${POSTGRES_PASSWORD:-codedoc}@postgres:5432/glitchtip
      SECRET_KEY: ${SECRET_KEY:-glitchtip-change-me}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [standard, full]

  openreplay:
    image: openreplay/openreplay:latest
    restart: unless-stopped
    profiles: [full]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    profiles: [standard, full]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    profiles: [standard, full]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources.yml:ro
    profiles: [standard, full]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    profiles: [full]

volumes:
  ollamadata:
  searxngdata:
  prometheusdata:
  grafanadata:
  lokidata: